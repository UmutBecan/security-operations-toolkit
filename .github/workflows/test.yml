name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Verify zero runtime dependencies
        run: |
          node -e "
            const deps = Object.keys(require('./package.json').dependencies || {});
            if (deps.length) { console.error('runtime dependencies found - ' + deps.join(', ')); process.exit(1); }
          "
      - run: npm test
